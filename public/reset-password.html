<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — FlareBase</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            glass: {
              bg: 'rgba(15, 23, 42, 0.65)',
              border: 'rgba(255, 255, 255, 0.08)',
              hover: 'rgba(255, 255, 255, 0.12)',
            }
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { background-color: #0b0e14; font-family: 'Inter', sans-serif; }
    .glass-panel { background: #11141a; border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    .glass-input { background: #181c24; border: 1px solid rgba(255, 255, 255, 0.12); color: #f8fafc; }
    .glass-input:focus { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59,130,246,0.25); outline: none; }
    #toast-container { position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 9999; display: flex; flex-direction: column; gap: 0.5rem; pointer-events: none; }
    .toast-message { padding: 1rem 1.5rem; border-radius: 0.5rem; font-size: 0.875rem; font-weight: 500; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); pointer-events: auto; animation: slideIn 0.3s cubic-bezier(0.16,1,0.3,1); }
    @keyframes slideIn { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .toast-success { background-color: rgba(16,185,129,0.9); color: white; border: 1px solid rgba(16,185,129,0.4); backdrop-filter: blur(8px); }
    .toast-error { background-color: rgba(239,68,68,0.9); color: white; border: 1px solid rgba(239,68,68,0.4); backdrop-filter: blur(8px); }
  </style>
</head>
<body class="text-slate-100 h-screen flex flex-col items-center justify-center">

  <div id="toast-container"></div>

  <div class="w-full max-w-md p-8 glass-panel rounded-2xl space-y-6">
    <div class="text-center space-y-2">
      <h1 class="text-2xl font-bold text-white">Reset Your Password</h1>
      <p class="text-sm text-slate-400">Enter a new password for your account.</p>
    </div>

    <form id="reset-form" class="space-y-4">
      <div class="space-y-1">
        <label class="text-xs font-semibold uppercase tracking-wider text-slate-400">New Password</label>
        <input type="password" id="input-password" required minlength="8" class="w-full px-4 py-2.5 rounded-xl glass-input text-sm" placeholder="••••••••••••">
      </div>
      <div class="space-y-1">
        <label class="text-xs font-semibold uppercase tracking-wider text-slate-400">Confirm Password</label>
        <input type="password" id="input-password-confirm" required minlength="8" class="w-full px-4 py-2.5 rounded-xl glass-input text-sm" placeholder="••••••••••••">
      </div>
      <button type="submit" class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold transition active:scale-95">
        Update Password
      </button>
    </form>
  </div>

  <script>
    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const el = document.createElement('div');
      el.className = `toast-message toast-${type}`;
      el.textContent = message;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(100%)';
        el.style.transition = 'all 0.3s ease';
        setTimeout(() => el.remove(), 300);
      }, 4000);
    }

    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('input-password').value;
      const confirm = document.getElementById('input-password-confirm').value;

      if (password !== confirm) {
        return showToast('Passwords do not match', 'error');
      }

      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');
      if (!token) {
        return showToast('Invalid or missing reset token', 'error');
      }

      try {
        const res = await fetch('/api/v1/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password })
        });
        const data = await res.json();

        if (!data.success) throw new Error(data.message || 'Reset failed');

        showToast('Password updated successfully! Redirecting...', 'success');
        setTimeout(() => {
          window.location.href = '/';
        }, 2000);
      } catch (err) {
        showToast(err.message, 'error');
      }
    });
  </script>
</body>
</html>
