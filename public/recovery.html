<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AegisDB - Disaster Recovery</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0f172a;
      color: #e2e8f0;
    }
    .glass-panel {
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-900 to-black">
  <div class="max-w-md w-full">
    <div class="text-center mb-8">
      <div class="mx-auto flex items-center justify-center h-16 w-16 rounded-2xl bg-rose-500/20 border border-rose-500/30 mb-4">
        <i class="fa-solid fa-triangle-exclamation text-2xl text-rose-500"></i>
      </div>
      <h2 class="text-3xl font-extrabold text-white tracking-tight">System Recovery</h2>
      <p class="text-sm text-slate-400 mt-2">Bare-metal restoration via encrypted snapshot</p>
    </div>

    <div class="glass-panel rounded-3xl p-8 shadow-2xl">
      <div id="drop-zone-restore" class="border-2 border-dashed border-slate-600/50 rounded-xl p-8 text-center hover:bg-slate-800/50 transition cursor-pointer relative overflow-hidden group mb-6">
        <i class="fa-solid fa-file-zipper text-4xl text-slate-400 mb-3 group-hover:text-indigo-400 group-hover:scale-110 transition duration-300"></i>
        <h3 class="text-sm font-semibold text-slate-200">Select Backup File</h3>
        <p class="text-xs text-slate-500 mt-1">Drag & drop a .gz SQLite backup</p>
        <input type="file" id="file-restore-backup" accept=".gz" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
      </div>

      <div id="restore-form-container" class="space-y-4 hidden opacity-0 transition-opacity duration-300">
        <div class="space-y-1">
          <label class="text-xs font-semibold uppercase tracking-wider text-slate-400">Server Recovery PIN</label>
          <input type="password" id="input-recovery-pin" class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 text-white text-sm focus:outline-none focus:border-indigo-500 transition" placeholder="Check server .env for RECOVERY_PIN">
        </div>
        
        <div class="space-y-1">
          <label class="text-xs font-semibold uppercase tracking-wider text-slate-400">Master Encryption Passkey</label>
          <input type="password" id="input-restore-passkey" class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 text-white text-sm focus:outline-none focus:border-indigo-500 transition" placeholder="The ENCRYPTION_KEY used for this backup">
        </div>

        <button type="button" id="btn-submit-restore" class="w-full mt-4 py-3 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-semibold shadow-lg shadow-rose-900/20 transition active:scale-95 flex items-center justify-center space-x-2">
          <i class="fa-solid fa-skull"></i>
          <span>Destructive Restore</span>
        </button>
      </div>
      
      <div id="toast-container" class="mt-4 text-center text-sm font-medium hidden"></div>
    </div>
    
    <div class="text-center mt-6">
      <a href="/" class="text-sm text-slate-500 hover:text-white transition"><i class="fa-solid fa-arrow-left mr-1"></i> Return to standard login</a>
    </div>
  </div>

  <!-- JS Lock Screen Overlay -->
  <div id="js-lock-screen" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-900 to-black">
    <div class="glass-panel rounded-3xl p-8 shadow-2xl max-w-sm w-full text-center">
      <div class="mx-auto flex items-center justify-center h-16 w-16 rounded-2xl bg-indigo-500/20 border border-indigo-500/30 mb-4">
        <i class="fa-solid fa-lock text-2xl text-indigo-400"></i>
      </div>
      <h2 class="text-2xl font-bold text-white mb-2">Recovery Locked</h2>
      <p class="text-xs text-slate-400 mb-6">Enter server PIN to access the recovery console.</p>
      
      <input type="password" id="input-js-pin" class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 text-white text-center text-lg tracking-widest focus:outline-none focus:border-indigo-500 transition mb-4" placeholder="••••••">
      
      <button type="button" id="btn-unlock-js" class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold transition active:scale-95">
        Unlock Console
      </button>
      <div id="js-lock-error" class="mt-3 text-xs text-rose-400 hidden"></div>
    </div>
  </div>

  <script>
    // --- Client-Side Security & Auto-Lock ---
    // Prevent right-click context menu
    document.addEventListener('contextmenu', e => e.preventDefault());
    
    // Prevent common DevTools keyboard shortcuts
    document.addEventListener('keydown', e => {
      if (
        e.key === 'F12' || 
        (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) || 
        (e.metaKey && e.altKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) || 
        (e.ctrlKey && e.key === 'U') ||
        (e.metaKey && e.key === 'U')
      ) {
        e.preventDefault();
      }
    });

    // JS Lock Screen Logic
    const lockScreen = document.getElementById('js-lock-screen');
    const inputJsPin = document.getElementById('input-js-pin');
    const btnUnlockJs = document.getElementById('btn-unlock-js');
    const jsLockError = document.getElementById('js-lock-error');
    const actualPinInput = document.getElementById('input-recovery-pin');
    let sessionPin = sessionStorage.getItem('recoverySessionPin');

    function showLockScreen() {
      sessionStorage.removeItem('recoverySessionPin');
      sessionPin = null;
      actualPinInput.value = '';
      inputJsPin.value = '';
      lockScreen.classList.remove('hidden');
    }

    if (sessionPin) {
      actualPinInput.value = sessionPin;
      lockScreen.classList.add('hidden');
    }

    btnUnlockJs.onclick = () => {
      const pin = inputJsPin.value.trim();
      if (!pin) return;
      // We don't verify against backend here to prevent brute force online checks easily.
      // We just store it and use it. If it's wrong, the final restore fails.
      sessionStorage.setItem('recoverySessionPin', pin);
      sessionPin = pin;
      actualPinInput.value = pin;
      lockScreen.classList.add('hidden');
      jsLockError.classList.add('hidden');
      resetIdleTimer();
    };

    // Auto-Lock (Idle Timeout): Show lock screen after 60 seconds of inactivity
    let idleTimeout;
    function resetIdleTimer() {
      if (!sessionPin) return; // don't start timer if already locked
      clearTimeout(idleTimeout);
      idleTimeout = setTimeout(() => {
        showLockScreen();
      }, 60000); // 60 seconds
    }
    ['mousemove', 'keydown', 'scroll', 'click'].forEach(evt => 
      document.addEventListener(evt, () => {
        if (sessionPin) resetIdleTimer();
      })
    );
    // -----------------------------------------

    const fileRestoreInput = document.getElementById('file-restore-backup');
    const restoreFormContainer = document.getElementById('restore-form-container');
    const btnSubmitRestore = document.getElementById('btn-submit-restore');
    const dropZone = document.getElementById('drop-zone-restore');
    const toast = document.getElementById('toast-container');

    function showToast(msg, type) {
      toast.textContent = msg;
      toast.className = `mt-4 text-center text-sm font-medium p-3 rounded-lg ${type === 'error' ? 'bg-rose-900/50 text-rose-300' : 'bg-emerald-900/50 text-emerald-300'}`;
      toast.classList.remove('hidden');
    }

    if (fileRestoreInput) {
      fileRestoreInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
          dropZone.classList.add('border-indigo-500/50', 'bg-indigo-900/20');
          dropZone.querySelector('i').className = 'fa-solid fa-file-circle-check text-4xl text-indigo-400 mb-3';
          dropZone.querySelector('h3').textContent = e.target.files[0].name;
          restoreFormContainer.classList.remove('hidden');
          setTimeout(() => restoreFormContainer.classList.remove('opacity-0'), 10);
        }
      });
    }

    if (btnSubmitRestore) {
      btnSubmitRestore.onclick = async () => {
        const file = fileRestoreInput.files[0];
        const passkey = document.getElementById('input-restore-passkey').value;
        const recoveryPin = document.getElementById('input-recovery-pin').value;
        
        if (!file) return showToast('Please select a backup file first.', 'error');
        if (!recoveryPin) return showToast('Recovery PIN is required.', 'error');
        if (!passkey) return showToast('Master passkey is required.', 'error');
        
        const formData = new FormData();
        formData.append('backup', file);
        formData.append('passkey', passkey);
        formData.append('recoveryPin', recoveryPin);
        
        try {
          btnSubmitRestore.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>Restoring System...</span>';
          btnSubmitRestore.disabled = true;
          
          const res = await fetch('/api/v1/system/restore', {
            method: 'POST',
            body: formData
          });
          
          const json = await res.json().catch(() => ({}));
          if (!res.ok || json.success === false) {
            throw new Error(json.message || `API Error (${res.status})`);
          }

          showToast('Restore complete! System is restarting. Redirecting to login...', 'success');
          
          setTimeout(() => {
            window.location.href = '/';
          }, 4000);
        } catch (err) {
          btnSubmitRestore.innerHTML = '<i class="fa-solid fa-skull"></i><span>Destructive Restore</span>';
          btnSubmitRestore.disabled = false;
          showToast(err.message, 'error');
        }
      };
    }
  </script>
</body>
</html>
