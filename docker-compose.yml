version: '3.8'

services:
  aegisdb:
    build:
      context: .
      dockerfile: Dockerfile.production
    container_name: aegisdb_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=us-east-1
      - LITESTREAM_S3_BUCKET=aegisdb-backups-prod
    volumes:
      - aegis_data:/data

volumes:
  aegis_data:
