version: '3.8'

services:
  aegisdb:
    build:
      context: .
      dockerfile: Dockerfile.production
    container_name: aegisdb_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=us-east-1
      - LITESTREAM_S3_BUCKET=aegisdb-backups-prod
    volumes:
      - aegis_data:/data

  # Uncomment the following block to enable automatic HTTPS via Caddy
  # caddy:
  #   image: caddy:2-alpine
  #   container_name: aegisdb_caddy
  #   restart: always
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   command: caddy reverse-proxy --from https://yourdomain.com --to http://aegisdb:3000
  #   depends_on:
  #     - aegisdb
  #   volumes:
  #     - caddy_data:/data
  #     - caddy_config:/config

volumes:
  aegis_data:
  # caddy_data:
  # caddy_config:
